name: Publish to Ubuntu PPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 2.4). Leave empty to use example.env.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish-ppa:
    name: Publish to PPA
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── 2. Install packaging tools ──────────────────────────────────────
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            debmake \
            devscripts \
            distro-info \
            distro-info-data \
            dput \
            equivs \
            gnupg

      # ── 3. Resolve package version ──────────────────────────────────────
      - name: Determine package version
        id: version
        run: |
          EXAMPLE_VERSION=$(grep -E '^\s*VERSION=' example.env | head -n1 | cut -d'=' -f2- | tr -d '"\r' | xargs || true)

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "$EXAMPLE_VERSION" ]; then
            VERSION="$EXAMPLE_VERSION"
          else
            VERSION="0.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      # ── 4. Create source tarball ─────────────────────────────────────────
      - name: Create source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="squidstats-${VERSION}"

          mkdir -p "ppa-build/${PKG_DIR}"

          rsync -a \
            --exclude='.git' \
            --exclude='debian' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.session' \
            --exclude='.env' \
            --exclude='ppa-build' \
            --exclude='dist' \
            ./ "ppa-build/${PKG_DIR}/"

          mkdir -p ppa-build/tarball
          tar -czf "ppa-build/tarball/squidstats_${VERSION}.orig.tar.gz" \
            -C ppa-build "${PKG_DIR}"

          echo "=== Created tarball ==="
          ls -lh ppa-build/tarball/

      # ── 5. Prepare debian directory for PPA ─────────────────────────────
      - name: Prepare debian directory for PPA
        run: |
          cp -r debian ppa-debian
          sed -i 's/debhelper-compat (= 13)/debhelper (>= 12~)/' ppa-debian/control
          sed -i 's/python3 (>= 3\.11)/python3/' ppa-debian/control
          echo "12" > ppa-debian/compat
          echo "=== Build-Depends after fix ==="
          grep 'Build-Depends' ppa-debian/control

      # ── 6. Publish to PPA ────────────────────────────────────────────────
      - name: Publish to Ubuntu PPA
        env:
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="$GITHUB_WORKSPACE/ppa-build/tarball/squidstats_${VERSION}.orig.tar.gz"
          SERIES_LIST="jammy noble resolute"

          export DEBEMAIL="manuelalberto.gorrin@gmail.com"
          export DEBFULLNAME="Manuel Alberto Gorrin Reyes"

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          if ! echo "$gpg_private_key" | gpg --batch --import; then
            echo "$gpg_private_key" | base64 --decode | gpg --batch --import
          fi

          GPG_KEY_FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ -z "$GPG_KEY_FINGERPRINT" ]; then
            echo "Unable to determine imported GPG key fingerprint" >&2
            exit 1
          fi

          printf '%s\n' '[DEFAULT]' 'passive_ftp = 1' > "$HOME/.dput.cf"
          chmod 600 "$HOME/.dput.cf"

          upload_orig=1

          for series in $SERIES_LIST; do
            ubuntu_version="$(distro-info --series "$series" -r | awk '{ print $1 }')"
            build_root="$(mktemp -d)"

            cp "$TARBALL" "$build_root/"
            tar -xzf "$TARBALL" -C "$build_root"

            (
              set -euo pipefail
              cd "$build_root/squidstats-$VERSION"

              debmake '-b:python3'
              cp -r "$GITHUB_WORKSPACE/ppa-debian/." debian/

              package_name="$(dpkg-parsechangelog --show-field Source)"
              upstream_version="$(dpkg-parsechangelog --show-field Version | cut -d- -f1)"

              rm -f debian/changelog
              dch --create \
                --distribution "$series" \
                --package "$package_name" \
                --newversion "${upstream_version}-ppa1~ubuntu${ubuntu_version}" \
                "New upstream release"

              mk-build-deps --install --remove --tool='sudo apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control

              if [ "$upload_orig" -eq 1 ]; then
                debuild -S -sa \
                  -k"$GPG_KEY_FINGERPRINT" \
                  -p"gpg --batch --passphrase \"$gpg_passphrase\" --pinentry-mode loopback"
              else
                debuild -S -sd \
                  -k"$GPG_KEY_FINGERPRINT" \
                  -p"gpg --batch --passphrase \"$gpg_passphrase\" --pinentry-mode loopback"
              fi

              dput ppa:kaelthasmanu/squidstats ../*_source.changes
            )

            upload_orig=0
            rm -rf "$build_root"
          done
