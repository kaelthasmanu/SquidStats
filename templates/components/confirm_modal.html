<!-- Custom Confirm Modal Component -->
<div
  id="confirmModal"
  class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 max-w-md w-full mx-4"
  >
    <div class="flex items-center mb-4">
      <i class="fas fa-exclamation-triangle text-yellow-500 text-2xl mr-3"></i>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
        {{ _("Confirmar Acción") }}
      </h3>
    </div>
    <p id="confirmMessage" class="text-gray-600 dark:text-gray-300 mb-6"></p>
    <div class="flex justify-end space-x-3">
      <button
        id="confirmCancelBtn"
        onclick="hideConfirmModal()"
        class="px-4 py-2 bg-gray-300 dark:bg-gray-600 hover:bg-gray-400 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-100 rounded-lg transition-colors"
      >
        {{ _("Cancelar") }}
      </button>
      <button
        id="confirmConfirmBtn"
        onclick="executeConfirmCallback()"
        class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors"
      >
        {{ _("Confirmar") }}
      </button>
    </div>
  </div>
</div>
